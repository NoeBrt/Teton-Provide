[package]
name = "teton-provisioning"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "audit-host"
path = "device/audit.rs"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "device"
path = "device/main.rs"
required-features = ["ble"]

[features]
ble = ["dep:bluer", "dep:tokio"]

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "signal"], optional = true }
