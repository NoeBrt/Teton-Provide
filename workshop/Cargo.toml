[package]
name = "teton-workshop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# The sensor's certificate and code types, so the workshop and the sensor cannot disagree on a format.
teton-provisioning = { path = "../device", features = ["provision"] }
ed25519-dalek = "2"
snow = "0.10"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
