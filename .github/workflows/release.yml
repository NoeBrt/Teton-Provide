# Builds Provide. for Android, macOS and Windows on a version tag (git tag v1.0.0 && git push origin v1.0.0) and
# attaches them to a GitHub pre-release. The builds are unsigned: see the release notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # The release APK is signed with the debug key Expo's template sets up: installable, not for a store.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: configurator/android
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Provide-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: configurator/Provide-*-android.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
        working-directory: configurator
      - run: npx tauri build --bundles dmg # its beforeBuildCommand exports the web build
        working-directory: configurator/desktop
      - run: mv configurator/desktop/src-tauri/target/release/bundle/dmg/*.dmg "Provide-${GITHUB_REF_NAME}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Provide-*-macos-arm64.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
        working-directory: configurator
      - run: npx tauri build --bundles nsis
        working-directory: configurator/desktop
      - run: Move-Item configurator/desktop/src-tauri/target/release/bundle/nsis/*.exe "Provide-$env:GITHUB_REF_NAME-windows-x64-setup.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Provide-*-windows-x64-setup.exe

  release:
    name: GitHub release
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "Provide. $GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
