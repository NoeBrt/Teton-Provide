# Builds on main populate caches shared with subsequent version tags.
# Only version tags publish the apps to a GitHub pre-release.
# Workshop deploy reuses the sensor binaries published in v1.1.0.
# The app builds are unsigned: see the release notes.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "configurator/**"
      - ".github/workflows/release.yml"
  workflow_dispatch: # builds only, to check them before a tag: gh workflow run release --ref BRANCH

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The tag names the files; a build-only run (from a branch, whose name may hold a "/") uses its run number.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # React Native's CMake setup discovers ccache automatically for the app's C++ targets.
      - name: Install C++ cache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Gradle refuses a project name ending with a dot, and the app is called "provide.": the label keeps it.
      - run: sed -i "s/^rootProject.name = 'provide\.'/rootProject.name = 'provide'/" android/settings.gradle && grep rootProject.name android/settings.gradle
      # The release APK is signed with the debug key Expo's template sets up: installable, not for a store. One ABI,
      # arm64-v8a (every Android phone of the last years), builds the native code once instead of four times.
      - run: ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a
        working-directory: configurator/android
      - name: C++ cache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Provide-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: configurator/Provide-*-android.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
        working-directory: configurator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: configurator/desktop/src-tauri
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npx tauri build --bundles dmg # its beforeBuildCommand exports the web build
        working-directory: configurator/desktop
      - run: mv configurator/desktop/src-tauri/target/release/bundle/dmg/*.dmg "Provide-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Provide-*-macos-arm64.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
        working-directory: configurator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: configurator/desktop/src-tauri
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npx tauri build --bundles nsis
        working-directory: configurator/desktop
      - run: Move-Item configurator/desktop/src-tauri/target/release/bundle/nsis/*.exe "Provide-$env:VERSION-windows-x64-setup.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Provide-*-windows-x64-setup.exe

  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      # Tauri's webview, and D-Bus for BlueZ (btleplug) and the Secret Service (keyring).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: npm ci
        working-directory: configurator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: configurator/desktop/src-tauri
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npx tauri build --bundles appimage,deb
        working-directory: configurator/desktop
      - run: |
          mv configurator/desktop/src-tauri/target/release/bundle/appimage/*.AppImage "Provide-${VERSION}-linux-x64.AppImage"
          mv configurator/desktop/src-tauri/target/release/bundle/deb/*.deb "Provide-${VERSION}-linux-x64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Provide-*-linux-x64.AppImage
            Provide-*-linux-x64.deb

  release:
    name: GitHub release
    needs: [android, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "Provide. $GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
