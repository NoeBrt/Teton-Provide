# Builds Provide. and the sensor binaries on a version tag (git tag v1.1.0 && git push origin v1.1.0) and
# attaches them to a GitHub pre-release. The builds are unsigned: see the release notes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds only, to check them before a tag: gh workflow run release --ref BRANCH

permissions:
  contents: read

env:
  # The tag names the files; a build-only run (from a branch, whose name may hold a "/") uses its run number.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}

jobs:
  sensor:
    name: Sensor (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device
          shared-key: sensor-${{ matrix.arch }}
      - run: cargo fmt --check
      - run: cargo clippy --features ble,stage --all-targets --locked -- -D warnings
      - run: cargo test --features ble,stage --all-targets --locked
      - run: cargo build --release --features ble,stage --bin device --bin stage --locked
      - name: Package binaries and checksums
        env:
          SENSOR_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$SENSOR_ARCH"
          mkdir -p dist
          for binary in device stage; do
            file="iot-${binary}-${VERSION}-linux-${SENSOR_ARCH}"
            cp "target/release/$binary" "dist/$file"
            (cd dist && sha256sum "$file" > "$file.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sensor-${{ matrix.arch }}
          path: device/dist/iot-*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle and its dependencies between runs
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Gradle refuses a project name ending with a dot, and the app is called "provide.": the label keeps it.
      - run: sed -i "s/^rootProject.name = 'provide\.'/rootProject.name = 'provide'/" android/settings.gradle && grep rootProject.name android/settings.gradle
      # The release APK is signed with the debug key Expo's template sets up: installable, not for a store. One ABI,
      # arm64-v8a (every Android phone of the last years), builds the native code once instead of four times.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: configurator/android
      - run: mv android/app/build/outputs/apk/release/app-release.apk "Provide-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: configurator/Provide-*-android.apk

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
        working-directory: configurator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: configurator/desktop/src-tauri
          shared-key: release
      - run: npx tauri build --bundles dmg # its beforeBuildCommand exports the web build
        working-directory: configurator/desktop
      - run: mv configurator/desktop/src-tauri/target/release/bundle/dmg/*.dmg "Provide-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Provide-*-macos-arm64.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - run: npm ci
        working-directory: configurator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: configurator/desktop/src-tauri
          shared-key: release
      - run: npx tauri build --bundles nsis
        working-directory: configurator/desktop
      - run: Move-Item configurator/desktop/src-tauri/target/release/bundle/nsis/*.exe "Provide-$env:VERSION-windows-x64-setup.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Provide-*-windows-x64-setup.exe

  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      # Tauri's webview, and D-Bus for BlueZ (btleplug) and the Secret Service (keyring).
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: npm ci
        working-directory: configurator
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: configurator/desktop/src-tauri
          shared-key: release
      - run: npx tauri build --bundles appimage,deb
        working-directory: configurator/desktop
      - run: |
          mv configurator/desktop/src-tauri/target/release/bundle/appimage/*.AppImage "Provide-${VERSION}-linux-x64.AppImage"
          mv configurator/desktop/src-tauri/target/release/bundle/deb/*.deb "Provide-${VERSION}-linux-x64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Provide-*-linux-x64.AppImage
            Provide-*-linux-x64.deb

  release:
    name: GitHub release
    needs: [android, macos, windows, linux, sensor]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "Provide. $GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
